syntax = "proto3";

package mocap; 

message Point3D {
  uint32 id = 1; 
  float x = 2;
  float y = 3;
  float z = 4;
  float visibility = 5;
}

message MocapFrame {
  uint64 timestamp = 1;
  string skeleton_type = 2;
  repeated Point3D landmarks = 3;
}

message BoneRotation {
  uint32 bone_id = 1;
  float qx = 2;
  float qy = 3;
  float qz = 4;
  float qw = 5;
}

message SolverFrame {
  float root_x = 1;
  float root_y = 2;
  float root_z = 3;
  repeated BoneRotation bones = 4;
  uint64 timestamp = 5;
}
