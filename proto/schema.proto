syntax = "proto3";

package motion_bridge; 

message ClientHandshake {
  string model_name = 1;
}

message BodyLandmarks {
  repeated float landmarks_data = 1;
}

message CaptureEventPacket {
  uint64 timestamp = 1;
  uint32 actor_id = 2;

  oneof payload {
    ClientHandshake handshake = 3;
    BodyLandmarks body = 6;
  }
}

message ProtoVector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message ProtoQuaternion {
  float x = 1;
  float y = 2;
  float z = 3;
  float w = 4;
}

message BodyFrame {
  ProtoVector3 root_position = 1;
  repeated ProtoQuaternion bone_rotations = 6;
}

message RigUpdatePacket {
  uint64 timestamp = 1;
  uint32 actor_id = 2;

  oneof payload {
    BodyFrame body = 6;
  }
}
